<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d1d">
<title>Havona Studio</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#090d1d;color:#f5f4f0;font-family:Arial,sans-serif}
header{padding:22px;background:linear-gradient(135deg,#17264b,#101426,#26183e)}
header,main{max-width:850px;margin:auto}
h1{color:#e6c477;margin:8px 0}
h2{font-size:19px}
p{color:#aab4cc;font-size:14px;line-height:1.6}
main{padding:16px}
.card{background:#121a30;border:1px solid #2b3859;border-radius:16px;padding:17px;margin-bottom:15px}
button,.filebtn,select{padding:13px;border:0;border-radius:10px;margin:4px 2px;font-size:14px;font-weight:bold}
button,.filebtn{cursor:pointer}
.primary,.filebtn{background:#e6c477;color:#171525}
.secondary{background:#263654;color:white}
.danger{background:#652b39;color:white}
button:disabled{opacity:.45}
input[type=file]{display:none}
audio{width:100%;margin-top:12px}
input[type=range]{width:100%;accent-color:#e6c477}
select{background:#263654;color:white}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px}
.tabs button{background:#172342;color:white;flex-shrink:0}
.tabs button.active{background:#e6c477;color:#171525}
.status{padding:12px;background:#090d1d;border:1px solid #2b3859;border-radius:10px;margin-top:12px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.track{background:#090d1d;border:1px solid #2b3859;border-radius:12px;padding:12px;margin-top:12px}
.hidden{display:none!important}
</style>
</head>

<body>

<header>
<div style="font-size:12px;letter-spacing:3px;color:#e6c477">YOUR PERSONAL MUSIC STUDIO</div>
<h1>Havona Studio</h1>
<p>Record vocals • Mix beats • Download your music
